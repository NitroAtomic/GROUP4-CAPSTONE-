<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vishing Quiz Results</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/quiz-results.css">
</head>

<body>

  <header class="site-header">
    <nav class="navbar">

      <div class="nav-left">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="#" class="nav-link">About</a>
      </div>

      <div class="nav-right">
        <a href="#" class="btn btn-login">Log in</a>
        <a href="#" class="btn btn-premium">Go Premium</a>
      </div>

    </nav>
  </header>

  <main class="quiz-results-page">

    <section class="quiz-results-container">

      <div class="quiz-results-icon">
        ✓
      </div>

      <h1>Vishing quiz complete!</h1>

      <div class="quiz-score">
        <span class="quiz-score-earned">8</span>
        <span class="quiz-score-total">/10</span>
      </div>

      <div class="quiz-results-breakdown">

        <div class="quiz-result-row">
          <span>Standard questions</span>
          <span><strong>7/7</strong> correct</span>
        </div>

        <div class="quiz-result-row">
          <span>Scenario-based questions</span>
          <span><strong>1/2</strong> correct</span>
        </div>

        <div class="quiz-result-row">
          <span>Simulation questions</span>
          <span><strong>0/1</strong> correct</span>
        </div>

      </div>

      <div class="quiz-results-actions">

        <a href="vishing-quiz.html" class="quiz-results-button">
          Retake quiz
        </a>

        <a
          href="../index.html#modules"
          class="quiz-results-button quiz-results-primary-button"
        >
          Back to modules
        </a>

      </div>

    </section>

  </main>

</body>

</html>
