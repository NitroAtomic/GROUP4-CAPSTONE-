<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phishing Quiz</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/quiz.css">
</head>

<body>

  <header class="site-header">
    <nav class="navbar">

      <div class="nav-left">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="#" class="nav-link">About</a>
      </div>

      <div class="nav-right">
        <a href="#" class="btn btn-login">Log in</a>
        <a href="#" class="btn btn-premium">Go Premium</a>
      </div>

    </nav>
  </header>

  <main class="quiz-page">

    <section class="quiz-container">

      <div class="quiz-header">
        <h1>Phishing quiz</h1>

        <p class="quiz-question-counter">
          Question 1 of 10
        </p>
      </div>

      <div class="quiz-progress-container">
        <div class="quiz-progress-bar"></div>
      </div>

      <div class="quiz-question-content">

        <span class="quiz-question-type">
          Scenario-based
        </span>

        <h2 class="quiz-question-text">
          You receive an email from your "company IT department"
          asking you to verify your login credentials through a link
          because of a security update. What should you do first?
        </h2>

        <div class="quiz-answer-list">

          <label class="quiz-answer-option">
            <input type="radio" name="answer" value="a">

            <span>
              Click the link and log in to verify
            </span>
          </label>

          <label class="quiz-answer-option">
            <input type="radio" name="answer" value="b">

            <span>
              Verify the request directly with IT through a known channel
            </span>
          </label>

          <label class="quiz-answer-option">
            <input type="radio" name="answer" value="c">

            <span>
              Reply to the email asking for more details
            </span>
          </label>

          <label class="quiz-answer-option">
            <input type="radio" name="answer" value="d">

            <span>
              Forward it to a coworker to check first
            </span>
          </label>

        </div>

      </div>

      <div class="quiz-navigation">
        <button class="quiz-navigation-button">
          Back
        </button>

        <button class="quiz-navigation-button quiz-next-button">
          Next
        </button>
      </div>

    </section>

  </main>

</body>
</html>
